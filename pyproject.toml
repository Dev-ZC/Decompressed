[build-system]
requires = [
    "scikit-build-core>=0.5.0",
    "pybind11>=2.11.0",
    "numpy>=1.20.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "decompressed"
version = "0.1.0"
description = "Efficient vector compression for machine learning"
authors = [
    {name = "Zaki Cole", email = "zakicole74@gmail.com"},
]
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.20.0",
]

[project.optional-dependencies]
# GPU acceleration (NVIDIA, AMD, Intel)
gpu = [
    "torch>=2.0.0",
    "triton>=2.0.0",
]

# GPU acceleration (NVIDIA only, alternative to torch)
gpu-cupy = [
    "cupy-cuda12x>=12.0.0",
    "triton>=2.0.0",
]

# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
]

# All optional dependencies
all = [
    "torch>=2.0.0",
    "triton>=2.0.0",
]

[tool.scikit-build]
# CMake configuration
cmake.build-type = "Release"
cmake.verbose = false
wheel.py-api = "py3"
wheel.install-dir = "decompressed"
minimum-version = "0.5"
build-dir = "build/{wheel_tag}"

# Source directory
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "python/decompressed/__init__.py"

# Note: If CMake fails, the build will fail
# Users can install dependencies manually if needed

# Platform-specific settings
[tool.scikit-build.cmake.define]
BUILD_PYTHON_BINDINGS = "ON"
BUILD_TESTS = "OFF"

# Auto-detect CUDA (users can override with: pip install . --config-settings=cmake.define.BUILD_CUDA=OFF)
# BUILD_CUDA will auto-detect based on platform in CMakeLists.txt

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=decompressed --cov-report=term-missing"

[project.urls]
Homepage = "https://github.com/Dev-ZC/Decompressed"
"Bug Tracker" = "https://github.com/Dev-ZC/Decompressed/issues"

[project.scripts]
decompressed = "decompressed.cli:main"
